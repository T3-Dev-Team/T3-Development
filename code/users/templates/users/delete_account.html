<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Delete account</title>
</head>
<body>
  <h1>Delete account</h1>
  <p>
    Your account and personal data will be deleted from the app.
    The reports you have created will stay, but won't be associated with you.
    This action can't be undone.
  </p>

  {% if error %}
    <p style="color: #b00020;">{{ error }}</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <button type="submit">Delete my account</button>
    <a href="/">Cancel</a>
  </form>
</body>
</html>
