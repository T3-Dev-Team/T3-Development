ified" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="146.8,267.0069,155.4411,262.2813,149.8344,263.0329,149.0828,257.4262,146.8,267.0069" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.9185" x="197.21" y="233.3638">administrator verifies (F-009)</text></g><!--link Reported to Rejected--><g class="link" data-entity-1="Reported" data-entity-2="Rejected" data-source-line="15" data-uid="lnk5" id="link_Reported_Rejected"><path d="M423.88,190.3069 C420.88,204.8969 419.83,223.3369 428.21,237.2969 C451.91,276.7469 568.3167,327.2747 633.4767,353.2547" fill="none" id="Reported-to-Rejected" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="639.05,355.4769,632.1714,348.4281,634.4056,353.6251,629.2086,355.8592,639.05,355.4769" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="300.8916" x="429.21" y="233.3638">administrator rejects [reason entered] (F-009)</text></g><!--link Reported to Duplicate--><g class="link" data-entity-1="Reported" data-entity-2="Duplicate" data-source-line="16" data-uid="lnk6" id="link_Reported_Duplicate"><path d="M473.9,167.6469 C549.04,171.0069 700.23,182.4069 734.21,220.2969 C811.23,306.1869 781.0334,455.7741 764.9534,515.3541" fill="none" id="Reported-to-Duplicate" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="763.39,521.1469,769.5969,513.5,764.6928,516.3196,761.8733,511.4155,763.39,521.1469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.6377" x="788.795" y="289.3638">administrator marks duplicate</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.8076" x="779.21" y="304.4966">[existing report selected] (F-009)</text></g><!--link Verified to Assigned--><g c