name: Compile Documentation PDF

on:
  workflow_dispatch:
    inputs:
      group_number:
        description: "Student Group ID (e.g. G03.2)"
        required: true
        default: "Gxx.x"
      app_acronym:
        description: "App Acronym (e.g. GYMREC)"
        required: true
        default: "AppAcronym"
      version:
        description: "Deliverable Version (v1 or v2)"
        required: true
        default: "v1"

jobs:
  build-pdf:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tooling
        run: sudo apt-get update && sudo apt-get install -y pandoc wkhtmltopdf
      - name: Build PDF Deliverable
        run: |
          mkdir -p docs/deliverables
          FILE_NAME="SE26_${{ github.event.inputs.group_number }}_${{ github.event.inputs.app_acronym }}_${{ github.event.inputs.version }}.pdf"
          cat docs/Home.md docs/[1-7]-*.md docs/A-*.md > docs/full-report.md
          cd docs
          pandoc full-report.md --from gfm --toc --toc-depth=3 --metadata title="CityFix - Project Documentation" --pdf-engine=wkhtmltopdf -o "deliverables/$FILE_NAME" --pdf-engine-opt=--enable-local-file-access
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-pdf
          path: docs/deliverables/*.pdf
